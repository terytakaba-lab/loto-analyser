name: Loto7 Scraper

on:
  schedule:
    # 毎週金曜 21:00 JST (12:00 UTC)
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: scrape (weekly update) or import (full CSV import)'
        required: false
        default: 'scrape'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch cheerio iconv-lite

      - name: Run scraper (weekly update)
        if: ${{ github.event.inputs.mode != 'import' }}
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: loto7-analyser
        run: node import_csv.js loto7.csv

      - name: Import CSV (full import)
        if: ${{ github.event.inputs.mode == 'import' }}
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: loto7-analyser
        run: node import_csv.js loto7.csv
